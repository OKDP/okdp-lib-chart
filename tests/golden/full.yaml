    okdp:
      contract: iceberg-catalog
      ref: demo-polaris
      source: internal
    uri: https://polaris-demo.okdp.sandbox/api/catalog
  06-demo-trino: |
    internalUri: trino://trino@demo-trino-trino.demo.svc:8080
    okdp:
      contract: trino
