name: ci

# The library's own tests (tests/run.sh, go test), then the shared chart CI,
# which lints the library, renders tests/chart and pushes a CI build to
# oci://ghcr.io/okdp/okdp-lib-chart/charts.
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "README.md"
  push:
    branches:
      - '**'
    paths-ignore:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.4

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Chart tests (contracts, golden renders, failure cases)
        run: tests/run.sh

      - name: Go tests
        run: go vet ./... && go test ./...

  chart:
    permissions:
      contents: read
      packages: write
    # TODO(no-kubocd): okdp-chart-ci.yml is not on OKDP/gh-workflows main
    # yet (it is on its no-kubocd branch): until it is, GitHub rejects this
    # whole file. Then switch to @v1 (and drop tools_ref) once released.
    # SECURITY (CI-01): @main and tools_ref are mutable refs; pin both to
    # the same 40-hex commit SHA once the branch stops moving.
    uses: OKDP/gh-workflows/.github/workflows/okdp-chart-ci.yml@main
    with:
      tools_ref: main
      publish_to_registry: "false"
      chart_roots: "."
      # The chart is the repository root: name it, or the listing would also
      # pick tests/chart as a chart of its own.
      package_paths: '["."]'
      push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
