{{- /* A define inside a manifest, and trimming markers on both ends. */ -}}
{{- define "mini.rules" -}}
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get"]
{{- end -}}
{{- if .Values.rbac -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "mini.fullname" . }}
rules:
{{ include "mini.rules" . }}
{{- end -}}
