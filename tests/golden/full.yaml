# Source: okdp-lib-test/templates/descriptor.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-mini-okdp
  namespace: demo
  labels:
    helm.sh/chart: okdp-lib-test-1.2.3-0.1.0
    app.kubernetes.io/name: okdp-lib-test
    app.kubernetes.io/instance: demo-mini
    app.kubernetes.io/version: "1.2.3"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: okdp
    okdp.io/instance: demo-mini
    okdp.io/service: okdp-lib-test
    okdp.io/provides-database-server: "true"
    okdp.io/provides-hive: "true"
    okdp.io/provides-s3: "true"
    okdp.io/provides-trino: "true"
data:
  service: "okdp-lib-test"
  version: "1.2.3-0.1.0"
  url: "https://mini-demo.okdp.sandbox"
  usage: |
    Mini is reachable at https://mini-demo.okdp.sandbox.
  outputs.yaml: |
    - contract: hive
      name: demo-mini
      values:
        thriftUri: thrift://demo-mini-hive-metastore.demo.svc:9083
    - contract: trino
      name: demo-mini
      values:
        catalogs:
        - tpch
        - bronze
        internalUri: trino://trino@demo-mini-trino.demo.svc:8080
        uri: trino://trino@trino-demo.okdp.sandbox:443
        url: https://trino-demo.okdp.sandbox
    - contract: database-server
      name: demo-mini-app
      secretRef:
        name: demo-mini-app-database-server-credentials
      values:
        dbName: app
        driver: org.postgresql.Driver
        engine: postgresql
        host: demo-mini-rw.demo.svc
        port: 5432
        sslMode: prefer
    - contract: s3
      name: demo-mini-store
      secretRef:
        name: demo-mini-store-s3-credentials
      values:
        apiUrl: http://store.example:8333
        pathStyle: true
        region: us-east-1
    - contract: s3
      name: demo-mini-shared
      secretRef:
        name: store-shared-creds
      values:
        apiUrl: http://store.example:8333
        pathStyle: true
        region: us-east-1
    - contract: s3
      name: demo-mini-open
      values:
        apiUrl: http://store.example:8333
        pathStyle: true
        region: us-east-1


