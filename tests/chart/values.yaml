# Inputs of the test templates. The ci/*-values.yaml files set them.
test:
  ui: false
  # okdp.oidc.dcr arguments (ctx aside), one rendering of okdp.oidc.dcrValues each (dcr mode)
  oidcDcr: []
  refs: []
  generated: false
  generatedTransform: ""
  provide:
    hive: false
    trino: false
    database: false
    s3: false
    bad: false
  vendor:
    enabled: false
    chart: mini
    replicas: 1
    hook: false
    # okdp.vendor.secretKeyRef: {name: <Secret name to re-point>}
    repoint: {}
    # okdp.vendor.crds: the vendored chart whose crds/ to render
    crds: ""
    # okdp.vendor.render upstream option: {protect: [...], append: [...], key: ...}
    upstream: {}
    # okdp.vendor.render valuesFile option: a file of this chart (vendor-values/mini.yaml)
    valuesFile: ""
    # okdp.vendor.render valuesConfigMap option (unset: the default, a values ConfigMap)
    # valuesConfigMap: false
