        - name: REQUEST
          value: '{"client_name":"demo-mini"}'
        - name: SECRET_KEYS
          value: '{"CLIENTID":".client_id","CLIENTSECRET":".client_secret","CLIENT_ID":".client_id","CLIENT_SECRET":".client_secret","ClientID":".client_id","ClientId":".client_id","ClientSecret":".client_secret","Client_ID":".client_id","Client_Secret":".client_secret","OIDC_CLIENT_ID":".client_id","OIDC_CLIENT_SECRET":".client_secret","client-id":".client_id","client-secret":".client_secret","clientId":".client_id","clientSecret":".client_secret","client_id":".client_id","client_secret":".client_secret","clientid":".client_id","clientsecret":".client_secret","oidc-client-id":".client_id","oidc-client-secret":".client_secret","oidcClientId":".client_id","oidcClientSecret":".client_secret","oidc_client_id":".client_id","oidc_client_secret":".client_secret","registration_access_token":".registration_access_token","registration_client_uri":".registration_client_uri"}'
        - name: CURL_OPTION
          value: -s
        image: quay.io/adaltas/oidc-dcr-job:0.4.0
        imagePullPolicy: IfNotPresent
        name: register
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        volumeMounts:
        - mountPath: /mnt/dcr
          name: dcr-volume
      initContainers:
      - command:
        - /bin/sh
        - -c
        - |-
          if [ -f /usr/local/share/ca-certificates/ca.crt ]; then CURL_OPTION="$CURL_OPTION --cacert /usr/local/share/ca-certificates/ca.crt"; fi
          i=0
          until curl $CURL_OPTION -f "$OIDC_DISCOVERY_URL" | jq -e .issuer >/dev/null 2>&1; do
            i=$((i + 1))
            if [ "$i" -ge 120 ]; then echo "ERROR: $OIDC_DISCOVERY_URL did not answer in 10 minutes"; exit 1; fi
            echo "INFO: waiting for the OIDC provider ($OIDC_DISCOVERY_URL)"
            sleep 5
          done
          echo "INFO: OIDC provider ready"
        env:
        - name: OIDC_DISCOVERY_URL
          value: https://keycloak.okdp.sandbox/realms/master/.well-known/openid-configuration
        - name: CURL_OPTION
          value: -s
        image: quay.io/adaltas/oidc-dcr-job:0.4.0
        imagePullPolicy: IfNotPresent
        name: wait-oidc-provider
        volumeMounts:
        - mountPath: /mnt/dcr
          name: dcr-volume
      restartPolicy: Never
      serviceAccountName: demo-mini-console-oidc-dcr
      volumes:
      - configMap:
          defaultMode: 493
          name: demo-mini-console-oidc-dcr
        name: dcr-volume
  ttlSecondsAfterFinished: 0

