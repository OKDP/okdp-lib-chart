      labels:
        app.kubernetes.io/name: mini
        app.kubernetes.io/instance: demo-mini
        app.kubernetes.io/version: "9.9"
    spec:
      containers:
        - name: mini
          image: "mirror.example.org/mini:1.0"
          ports:
            - containerPort: 8080
            - containerPort: 9090
          env:
            - name: TOKEN
