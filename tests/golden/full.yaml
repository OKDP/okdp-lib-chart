    dbName: app
    driver: com.mysql.cj.jdbc.Driver
    engine: mysql
    host: mysql.example.org
    okdp:
      contract: database-server
      ref: mysql-db
      source: external
    port: 3306
  03-ext-hive: |
    okdp:
      contract: hive
      ref: ext-hive
      source: external
    thriftUri: thrift://hms.example.org:9083
