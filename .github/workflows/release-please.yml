name: release-please

# Every push to main is a candidate: release-please keeps one release pull
# request up to date, and cutting the release is merging that pull request.
# The tag (vX.Y.Z) is both the chart version and the Go module version of
# github.com/okdp/okdp-lib-chart/contracts.
on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'OKDP'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release-please
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    # TODO(no-kubocd): switch to OKDP/gh-workflows@v1 (and drop tools_repository
    # and tools_ref) once released. The no-kubocd branch of the shared
    # workflows only exists on alliage-io/okdp-gh-workflows: a ref missing on
    # OKDP/gh-workflows makes GitHub reject this whole file.
    uses: alliage-io/okdp-gh-workflows/.github/workflows/okdp-chart-ci.yml@no-kubocd
    with:
      tools_repository: alliage-io/okdp-gh-workflows
      tools_ref: no-kubocd
      publish_to_registry: "true"
      # Published as oci://quay.io/okdp/okdp-lib-chart (no repository prefix).
      # TODO(no-kubocd): okdp-chart-ci.yml rejects an empty oci_package_prefix
      # on release; the release fails until gh-workflows accepts it and pushes
      # to oci://<registry>/<owner>.
      oci_package_prefix: ""
      on_existing_tag: "fail"
      chart_roots: "."
      package_paths: '["."]'
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_ROBOT_TOKEN: ${{ secrets.REGISTRY_ROBOT_TOKEN }}
